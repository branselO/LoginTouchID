<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login con Touch ID</title>
    <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>

    <style>
        /* Variables para mantener una paleta de colores consistente */
        :root {
            --primary: #4f46e5; /* Color índigo moderno */
            --primary-hover: #4338ca;
            --background: #f3f4f6; /* Gris muy claro para el fondo */
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Contenedor principal tipo tarjeta */
        .login-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px; /* Tamaño ideal para formularios */
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); /* Sombra suave */
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Estilos del campo de texto */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input[type="email"] { 
            width: 100%; 
            padding: 12px 16px; 
            font-size: 1rem; 
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); /* Anillo de enfoque */
        }

        /* Botones globales */
        button { 
            width: 100%;
            padding: 12px; 
            font-size: 1rem; 
            font-weight: 600;
            cursor: pointer; 
            border-radius: 8px;
            border: none;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98); /* Pequeña animación al hacer clic */
        }

        /* Clases específicas para botones */
        .btn-primary {
            background-color: var(--primary);
            color: white;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background-color: var(--background);
            border-color: var(--primary);
        }

        .btn-small {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
            background-color: var(--background);
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .btn-small:hover {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        /* Divisor con líneas a los lados */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }
    </style>
    
</head>
<body>
    <div class="login-card">
        <h2>Iniciar Sesión con Touch ID</h2>
        <p class="subtitle">Verifica tu identidad biométrica para entrar</p>
    
        {% csrf_token %}
        
         <div class="input-group">
            <label for="username">Nombre de usuario:</label>
            <input  size="67.5" type="text" id="username">
        </div>

        <!-- Indicador visual -->
        <div id="fingerprint-status" class="status-container" style="text-align: center; margin: 20px 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a10 10 0 0 0-10 10"></path>
                <path d="M17 12c0-1.2-.5-2.3-1.4-3.1"></path>
                <path d="M9.6 15.6c-.7-.4-1.2-1.1-1.4-1.9"></path>
                <path d="M13 19.3c-1.8.6-3.8.3-5.3-.8"></path>
                <path d="M15.4 8.6c-1.5-1-3.5-1-5 0"></path>
            </svg>
            <p id="status-message" style="font-size: 0.9em; color: #666; margin-top: 10px; text-align: center;"></p>
        </div>

        <button id="btn-login" class="btn-primary">Ingresar con huella</button>
        
        <div class="divider">¿No tienes cuenta?</div>
        
        <!-- Enlace directo a la vista de registro -->
        <a href="{% url 'register_fingerprint_page' %}" class="btn-outline" style="display: block; text-align: center; text-decoration: none; padding: 10px;">
            Registrarse ahora
        </a>
    </div>

    <script>
        const { startAuthentication } = SimpleWebAuthnBrowser;
        const btnLogin = document.getElementById('btn-login');
        const statusMessage = document.getElementById('status-message');
        const usernameInput = document.getElementById('username');

        btnLogin.addEventListener('click', async () => {
            const username = usernameInput.value;
            if (!username) {
                statusMessage.innerText = "Por favor, ingresa tu usuario primero.";
                return;
            }

            statusMessage.innerText = "Buscando usuario...";

            try {
                // FASE 1: Enviamos el usuario y pedimos el desafío
                const beginResponse = await fetch("{% url 'webauthn_login_begin' %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                
                const options = await beginResponse.json();

                if (options.error) {
                    statusMessage.innerText = options.error;
                    return;
                }

                statusMessage.innerText = "Por favor, usa tu Touch ID...";

                // FASE 2: Despertar al Touch ID para autenticar (Login)
                const touchIdResponse = await startAuthentication(options);

                statusMessage.innerText = "Verificando tu identidad...";

                // FASE 3: Enviar la firma a Django
                const completeResponse = await fetch("{% url 'webauthn_login_complete' %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(touchIdResponse),
                });

                const result = await completeResponse.json();

                if (result.status === "ok") {
                    statusMessage.innerText = "¡Éxito! " + result.message;
                    // Aquí podrías redirigir al panel principal:
                    // window.location.href = '/dashboard/';
                } else {
                    statusMessage.innerText = "Error: " + result.error;
                }

            } catch (error) {
                statusMessage.innerText = "Proceso cancelado o fallido.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
